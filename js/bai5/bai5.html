<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ứng dụng Quản lý sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .khung-nhap { background: #F2F2F2; padding: 15px; width: 350px; margin-bottom: 20px; border-radius: 5px; }
        table { border-collapse: collapse; width: 550px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #DDD; }
        tr:nth-child(even) { background-color: #F9F9F9; }
        button { background-color: #4CAF50; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h3>Add New Product</h3>
    <div class="khung-nhap">
        <input type="text" id="ten_moi" placeholder="New Product">
        <button onclick="themSanPham()">Add</button>
    </div>

    <h3>Display All Product</h3>
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th></th>
                <th id="so_luong" style="color: brown; text-align: right;"></th>
            </tr>
        </thead>
        <tbody id="danh_sach"></tbody>
    </table>

    <script src="bai5.js"></script>
</body>
</html>
